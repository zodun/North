name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    env:
      # Stub Supabase env so apps/web's build can resolve @t3-oss/env at
      # build-time. Real secrets only ever exist in Supabase / EAS /
      # the host's environment — never in CI.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-stub-anon-key
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ci-stub-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-stub-service-role-key
      CORS_ORIGIN: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install
        # CI=true makes biome non-interactive; lefthook install is fine
        # to run in CI but the hooks themselves aren't exercised here.
        run: bun install --frozen-lockfile

      - name: Biome (check-only)
        run: bun run check:ci

      - name: Type check (turbo)
        run: bun run check-types

      - name: Client-bundle secrets leak check
        run: bun run check:secrets

      - name: Build web
        run: bun run build --filter=web

      - name: Native prebuild dry-run
        # Confirms the native app's config is valid for an EAS build
        # without actually invoking EAS. Real builds happen out of CI
        # via `eas build` from a developer machine or EAS Cloud.
        working-directory: apps/native
        run: bunx expo config --type prebuild >/dev/null

  deploy-migrations-dev:
    # Auto-deploys Supabase migrations (and the signal-summary Edge
    # Function) to the dev project after every merge to main. Prod
    # deploys remain manual — operator runs `supabase db push` against
    # the prod-linked CLI from a developer machine. See
    # docs/supabase-projects.md for setup of the two required secrets:
    #   SUPABASE_ACCESS_TOKEN     — supabase.com/dashboard/account/tokens
    #   SUPABASE_DEV_PROJECT_REF  — the dev project ref
    name: Deploy migrations → dev
    runs-on: ubuntu-latest
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guard — required secrets present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "${{ secrets.SUPABASE_DEV_PROJECT_REF }}" ]; then
            echo "✘ SUPABASE_ACCESS_TOKEN or SUPABASE_DEV_PROJECT_REF not set."
            echo "  Add them as GitHub Actions repository secrets — see docs/supabase-projects.md."
            exit 1
          fi

      - name: Link to dev project
        run: supabase link --project-ref ${{ secrets.SUPABASE_DEV_PROJECT_REF }}

      - name: Apply migrations
        run: supabase db push --linked

      - name: Deploy Edge Functions
        run: supabase functions deploy signal-summary --project-ref ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
